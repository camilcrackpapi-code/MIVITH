<!-- Conexión con Firebase Firestore -->
    <script type="module">
        import { db } from '../controllers/firebase-config.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const btnEnviar = document.getElementById('btnEnviarPedido');

        btnEnviar.addEventListener('click', async () => {
            if (carrito.length === 0) {
                alert("Tu pedido está vacío.");
                return;
            }

            const confirmar = confirm("¿Deseas enviar tu pedido?");
            if (!confirmar) return;

            const numeroMesa = prompt("Por favor, ingresa tu Número de Mesa o Nombre:");
            if (!numeroMesa || numeroMesa.trim() === "") {
                alert("❌ Es necesario ingresar tu mesa o nombre para procesar el pedido.");
                return;
            }

            btnEnviar.innerText = "Enviando...";
            btnEnviar.disabled = true;

            const totalCalculado = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            try {
                await addDoc(collection(db, "pedidos"), {
                    cliente: `Mesa ${numeroMesa.trim()}`,
                    items: carrito,
                    total: totalCalculado,
                    completada: false,
                    timestamp: serverTimestamp()
                });

                alert("¡Pedido enviado con éxito a la cocina!");
                carrito = [];
                actualizarInterfazCarrito();
                toggleCarrito();

            } catch (error) {
                console.error("Error al enviar pedido:", error);
                alert("❌ Error al enviar el pedido: " + error.message);
            } finally {
                btnEnviar.innerText = "Enviar Pedido al Admin";
                btnEnviar.disabled = false;
            }
        });
    </script>
