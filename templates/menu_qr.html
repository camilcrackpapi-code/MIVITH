<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú QR - Mivith</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/menu_qr.css">
</head>
<body>

    <header style="text-align: center; padding: 15px 0;">
        <h1 style="margin:0;">Mivith - Pedido en Mesa</h1>
    </header>

    <section class="seccion-carta">
        <h2>Realiza tu Pedido</h2>
        <p class="instruccion-scroll">↔ Desliza hacia los lados para ver todas nuestras categorías</p>
        
        <div class="contenedor-horizontal" id="contenedorCartaDinamico">
            <p style="text-align: center; width: 100%; color: #8d6e63;">Cargando menú...</p>
        </div>
    </section>

    <div class="cart-float-btn" onclick="toggleCarrito()">
        🛒 Pedido (<span id="cart-count">0</span>) | $<span id="cart-float-total">0</span>
    </div>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3 style="margin: 0;">Tu Pedido</h3>
            <button class="cart-close" onclick="toggleCarrito()">&times;</button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <p style="color: #666; text-align: center;">Tu pedido está vacío.</p>
        </div>

        <div class="cart-footer">
            <h4 style="margin: 0; font-size: 1.1rem;">Total: $<span id="cart-total">0</span> COP</h4>
            <button class="btn-submit-order" id="btnEnviarPedido">Enviar Pedido al Admin</button>
        </div>
    </div>

    <script type="module">
        import { db } from '../controllers/firebase-config.js';
        import { collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        let carrito = [];
        const contenedorCarta = document.getElementById('contenedorCartaDinamico');
        const ordenCategorias = ['Hamburguesas', 'Perros & Salchipapas', 'Postres', 'Bebidas', 'Promociones'];

        onSnapshot(collection(db, "menu_completo"), (snapshot) => {
            if (snapshot.empty) {
                contenedorCarta.innerHTML = '<p style="text-align: center; width: 100%; color: #8d6e63;">Aún no hay platos en el menú.</p>';
                return;
            }

            const platosPorCategoria = {};
            ordenCategorias.forEach(cat => platosPorCategoria[cat] = []);

            snapshot.forEach(doc => {
                const plato = doc.data();
                if (platosPorCategoria[plato.categoria]) {
                    platosPorCategoria[plato.categoria].push(plato);
                }
            });

            let htmlFinal = '';

            ordenCategorias.forEach(categoria => {
                const platos = platosPorCategoria[categoria];

                if (platos.length > 0) {
                    const colorTitulo = categoria === 'Promociones' ? 'style="color: #f1c40f;"' : '';

                    let columnaHTML = `
                        <div class="columna-carta">
                            <h3 class="titulo-categoria" ${colorTitulo}>${categoria}</h3>`;

                    platos.forEach(plato => {
                        const precioF = plato.precio ? plato.precio.toLocaleString('es-CO') : '0';
                        const nombreLimpio = plato.nombre.replace(/'/g, "\\'");

                        columnaHTML += `
                            <div class="item-carta">
                                <div class="item-header">
                                    <h4>${plato.nombre}</h4>
                                    <span class="item-precio">$${precioF}</span>
                                </div>
                                <p class="item-desc">${plato.descripcion}</p>
                                <button class="btn-add" onclick="agregarAlCarrito('${nombreLimpio}', ${plato.precio})">+ Agregar</button>
                            </div>
                        `;
                    });

                    columnaHTML += `</div>`;
                    htmlFinal += columnaHTML;
                }
            });

            contenedorCarta.innerHTML = htmlFinal;
        }, (error) => {
            console.error("Error al cargar la carta QR:", error);
            contenedorCarta.innerHTML = '<p style="text-align: center; width: 100%; color: red;">Error al cargar el menú.</p>';
        });

        window.toggleCarrito = function() {
            document.getElementById('cart-sidebar').classList.toggle('active');
        };

        window.agregarAlCarrito = function(nombre, precio) {
            const itemExistente = carrito.find(item => item.nombre === nombre);
            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                carrito.push({ nombre, precio, cantidad: 1 });
            }
            actualizarInterfazCarrito();
            document.getElementById('cart-sidebar').classList.add('active');
        };

        window.cambiarCantidad = function(nombre, cambio) {
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.nombre !== nombre);
                }
            }
            actualizarInterfazCarrito();
        };

        function actualizarInterfazCarrito() {
            const contenedorItems = document.getElementById('cart-items');
            const totalElemento = document.getElementById('cart-total');
            const floatTotalElemento = document.getElementById('cart-float-total');
            const contadorElemento = document.getElementById('cart-count');

            if (carrito.length === 0) {
                contenedorItems.innerHTML = '<p style="color: #666; text-align: center;">Tu pedido está vacío.</p>';
                totalElemento.innerText = '0';
                floatTotalElemento.innerText = '0';
                contadorElemento.innerText = '0';
                return;
            }

            contenedorItems.innerHTML = '';
            let total = 0;
            let totalCantidad = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                totalCantidad += item.cantidad;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                const nombreLimpio = item.nombre.replace(/'/g, "\\'");
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.nombre}</strong><br>
                        <small style="color:#666;">$${item.precio.toLocaleString('es-CO')} c/u</small>
                    </div>
                    <div class="cart-item-controls">
                        <button onclick="cambiarCantidad('${nombreLimpio}', -1)">-</button>
                        <span style="margin: 0 5px; font-weight:bold;">${item.cantidad}</span>
                        <button onclick="cambiarCantidad('${nombreLimpio}', 1)">+</button>
                    </div>
                `;
                contenedorItems.appendChild(itemDiv);
            });

            const totalFormateado = total.toLocaleString('es-CO');
            totalElemento.innerText = totalFormateado;
            floatTotalElemento.innerText = totalFormateado;
            contadorElemento.innerText = totalCantidad;
        }

        const btnEnviar = document.getElementById('btnEnviarPedido');

        btnEnviar.addEventListener('click', async () => {
            if (carrito.length === 0) {
                alert("Tu pedido está vacío.");
                return;
            }

            const confirmar = confirm("¿Deseas enviar tu pedido a la cocina?");
            if (!confirmar) return;

            const params = new URLSearchParams(window.location.search);
            let numeroMesa = params.get('mesa'); 

            if (!numeroMesa || numeroMesa.trim() === "") {
                numeroMesa = prompt("No detectamos mesa, por favor ingrésala (ej: 1):");
            }

            if (!numeroMesa || numeroMesa.trim() === "") {
                alert("❌ Es necesario ingresar la mesa para procesar el pedido.");
                return;
            }

            btnEnviar.innerText = "Enviando...";
            btnEnviar.disabled = true;

            const totalCalculado = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            try {
                await addDoc(collection(db, "pedidos"), {
                    cliente: `Mesa ${numeroMesa.trim()}`,
                    items: carrito,
                    total: totalCalculado,
                    completada: false,
                    timestamp: serverTimestamp()
                });

                alert("¡Pedido enviado con éxito a la cocina!");
                carrito = [];
                actualizarInterfazCarrito();
                toggleCarrito();

            } catch (error) {
                console.error("Error al enviar el pedido:", error);
                alert("❌ Ocurrió un error al enviar tu pedido. Por favor intenta de nuevo.");
            } finally {
                btnEnviar.innerText = "Enviar Pedido al Admin";
                btnEnviar.disabled = false;
            }
        });
    </script>

</body>
</html>
