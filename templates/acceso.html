<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesion - Mivith</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/acceso.css">
</head>
<body class="body-acceso">

    <div id="aviso-evaluacion" class="fondo-aviso-eval">
        <div class="caja-aviso-eval">
            <h3>🎓 Nota de Evaluación</h3>
            <p>Se dejó el usuario y contraseña establecidos por temas de practicidad para la evaluación.</p>
            <button onclick="document.getElementById('aviso-evaluacion').style.display='none'">Entendido</button>
        </div>
    </div>

    <div class="contenedor-acceso">
        <div class="cabecera-acceso">
            <h2>Mivith Admin</h2>
            <p style="color: #c1d5ee; padding-bottom: 20px; margin: 0; font-weight: bold;">Iniciar Sesión</p>
        </div>

        <div class="cuerpo-acceso">
            <form id="formLogin" class="formulario activo" novalidate>
                <label for="emailLogin">Correo Electrónico</label>
                <input type="email" id="emailLogin" value="Admin@gmail.com" required>
                
                <label for="passLogin">Contraseña</label>
                <input type="password" id="passLogin" value="admin123" required>
                
                <p id="mensajeLogin" class="mensaje-alerta oculto"></p>
                <button type="submit" id="btnEntrar" class="btn-principal">Entrar al Panel</button>
            </form>
        </div>
        
        <div class="pie-acceso">
            <a href="../index.html">← Volver al inicio</a>
        </div>
    </div>

    <script type="module" src="../controllers/login.js"></script>
</body>
</html>
