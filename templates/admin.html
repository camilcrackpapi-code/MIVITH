<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - Mivith</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="sidebar">
        <h2>Mivith Admin</h2>
        <ul class="menu-lateral">
            <li id="btnMenuOrdenes" class="activo" onclick="mostrarSeccion('ordenes')">🔔 Órdenes Activas</li>
            <li id="btnMenuPromos" onclick="mostrarSeccion('promociones')">🏷️ Productos / Promos</li>
            <li onclick="cerrarSesion()">🚪 Cerrar Sesión</li>
        </ul>
    </div>
    <div class="main-content">
        <div id="seccionOrdenes">
            <div class="header-panel">
                <div>
                    <h1 style="margin: 0;">Monitor de Cocina (Comandas)</h1>
                    <p style="margin: 5px 0 0 0; color: #7da0ca;">Pedidos recibidos desde el menú web en tiempo real</p>
                </div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <button class="btn-limpiar-todo" onclick="limpiarTodosLosPedidos()">🗑️ Borrar Historial</button>
                    <div class="reloj" id="reloj">--:--:--</div>
                </div>
            </div>
            <div class="ordenes-grid" id="contenedorOrdenes"></div>
        </div>
        <div id="seccionPromociones" style="display: none;">
            <div class="header-panel">
                <div>
                    <h1 style="margin: 0;">Gestión de Productos</h1>
                    <p style="margin: 5px 0 0 0; color: #7da0ca;">Registra o edita platos con su imagen, nombre y precio</p>
                </div>
            </div>
            <div class="promociones-content" style="margin-top: 20px;">
                <div id="contenedorFormulariosProductos"></div>
                <button type="button" class="btn-nuevo-prod" id="btnAgregarNuevoFormulario" style="width: 100%; max-width: 600px; margin-top: 10px;">➕ Agregar Nuevo Producto</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { auth, db } from '../controllers/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        onAuthStateChanged(auth, (usuario) => {
            if (!usuario) {
                alert("Acceso denegado. Debes iniciar sesión como administrador.");
                window.location.href = "../index.html";
            }
        });

        window.cerrarSesion = () => {
            signOut(auth).then(() => {
                window.location.href = "../index.html";
            });
        };

        window.mostrarSeccion = (seccion) => {
            const secOrdenes = document.getElementById('seccionOrdenes');
            const secPromos = document.getElementById('seccionPromociones');
            const btnOrdenes = document.getElementById('btnMenuOrdenes');
            const btnPromos = document.getElementById('btnMenuPromos');

            if (seccion === 'ordenes') {
                secOrdenes.style.display = 'block';
                secPromos.style.display = 'none';
                btnOrdenes.classList.add('activo');
                btnPromos.classList.remove('activo');
            } else if (seccion === 'promociones') {
                secOrdenes.style.display = 'none';
                secPromos.style.display = 'block';
                btnPromos.classList.add('activo');
                btnOrdenes.classList.remove('activo');
            }
        };

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        const q = query(collection(db, "pedidos"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('contenedorOrdenes');
            
            if (snapshot.empty) {
                contenedor.innerHTML = '<h3 style="color: #7da0ca; grid-column: 1/-1; text-align: center;">No hay pedidos registrados en este momento.</h3>';
                return;
            }

            let acumuladoHTML = '';

            snapshot.forEach((docSnap) => {
                const orden = docSnap.data();
                const id = docSnap.id;
                let itemsHTML = '';

                const listaItems = orden.items || orden.platos || [];
                
                listaItems.forEach(p => {
                    const cantidad = p.cantidad || p.cant || 1;
                    const precio = p.precio ? `($${(p.precio * cantidad).toLocaleString('es-CO')})` : '';
                    itemsHTML += `<li><span>${cantidad}x ${p.nombre}</span> <small>${precio}</small></li>`;
                });

                const estaCompletada = orden.completada || false;
                const cliente = orden.cliente || 'Cliente';
                
                let hora = 'Reciente';
                if (orden.timestamp) {
                    hora = orden.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } else if (orden.fecha) {
                    hora = orden.fecha;
                }

                const total = orden.total ? `$${orden.total.toLocaleString('es-CO')} COP` : '';

                acumuladoHTML += `
                    <div class="orden-card ${estaCompletada ? 'completada' : ''}">
                        <div class="cliente-tag">👤 ${cliente}</div>
                        <h3 style="margin-top: 0; color: #052659;">Orden</h3>
                        <div class="cliente-info">🕒 Recibido: ${hora}</div>
                        <ul class="lista-platos">
                            ${itemsHTML}
                        </ul>
                        ${total ? `<div class="total-pedido">Total: ${total}</div>` : ''}
                        <button class="btn-despachar ${estaCompletada ? 'btn-completado' : ''}" 
                                onclick="alternarEstadoOrden('${id}', ${estaCompletada})">
                            ${estaCompletada ? '✓ Completado (Deshacer)' : 'Despachar Pedido ✓'}
                        </button>
                        <button class="btn-eliminar" onclick="eliminarOrden('${id}')">Eliminar Comanda</button>
                    </div>
                `;
            });

            contenedor.innerHTML = acumuladoHTML;
        }, (error) => {
            console.error(error);
        });

        window.alternarEstadoOrden = async (id, estadoActual) => {
            try {
                const refPedido = doc(db, "pedidos", id);
                await updateDoc(refPedido, { completada: !estadoActual });
            } catch (error) {
                console.error(error);
            }
        };

        window.eliminarOrden = async (id) => {
            if (confirm("¿Estás seguro de eliminar esta comanda?")) {
                try {
                    await deleteDoc(doc(db, "pedidos", id));
                } catch (error) {
                    console.error(error);
                }
            }
        };

        window.limpiarTodosLosPedidos = async () => {
            if (confirm("⚠️ ¿Deseas borrar TODOS los pedidos recibidos?")) {
                try {
                    const querySnapshot = await getDocs(collection(db, "pedidos"));
                    const promesas = querySnapshot.docs.map(d => deleteDoc(doc(db, "pedidos", d.id)));
                    await Promise.all(promesas);
                } catch (error) {
                    console.error(error);
                }
            }
        };

        const contenedorFormularios = document.getElementById('contenedorFormulariosProductos');
        const btnAgregarNuevoFormulario = document.getElementById('btnAgregarNuevoFormulario');

        function crearFormularioProducto() {
            const div = document.createElement('div');
            div.className = 'formulario-admin';
            div.style.marginBottom = '20px';
            
            div.innerHTML = `
                <form class="form-producto-dinamico">
                    <div class="fila-producto">
                        <div class="preview-img">
                            <img class="previewImagen" src="https://via.placeholder.com/150?text=Vista+Previa" alt="Vista previa">
                        </div>
                        <div class="campos-producto">
                            <label>Nombre del producto</label>
                            <input type="text" class="prodNombre" placeholder="Ej. Hamburguesa Especial" required>
                            
                            <label>Precio (COP)</label>
                            <input type="number" class="prodPrecio" placeholder="Ej. 18000" required>
                            
                            <label>URL de la imagen</label>
                            <input type="url" class="prodUrl" placeholder="https://..." required>
                        </div>
                    </div>
                    <div class="acciones-formulario">
                        <button type="submit" class="btn-guardar btnGuardarProd">Guardar Producto</button>
                        <button type="button" class="btn-eliminar-prod btnEliminarProd" style="display: none;">🗑️ Eliminar Producto</button>
                    </div>
                </form>
            `;

            contenedorFormularios.appendChild(div);

            const form = div.querySelector('.form-producto-dinamico');
            const inputUrl = div.querySelector('.prodUrl');
            const previewImg = div.querySelector('.previewImagen');
            const btnGuardar = div.querySelector('.btnGuardarProd');
            const btnEliminar = div.querySelector('.btnEliminarProd');
            const inputs = div.querySelectorAll('input');

            inputUrl.addEventListener('input', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    previewImg.src = url;
                } else {
                    previewImg.src = 'https://via.placeholder.com/150?text=Vista+Previa';
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault(); 
                
                const nuevoProducto = {
                    nombre: div.querySelector('.prodNombre').value,
                    precio: parseFloat(div.querySelector('.prodPrecio').value),
                    imagen: div.querySelector('.prodUrl').value
                };
                
                console.log("Producto capturado:", nuevoProducto);
                
                inputs.forEach(input => input.disabled = true);
                
                btnGuardar.innerText = '✅ Producto Guardado';
                btnGuardar.disabled = true;
                btnEliminar.style.display = 'block';
            });

            btnEliminar.addEventListener('click', () => {
                if(confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                    div.remove();
                }
            });
            
            div.querySelector('.prodNombre').focus();
        }

        btnAgregarNuevoFormulario.addEventListener('click', crearFormularioProducto);

        crearFormularioProducto();
    </script>
</body>
</html>
