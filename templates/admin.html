<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Mivith</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">
        
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>Panel Admin</h2>
                <div id="reloj"></div>
            </div>
            
            <nav class="sidebar-nav">
                <button id="btnMenuOrdenes" class="activo" onclick="mostrarSeccion('ordenes')">📄 Órdenes</button>
                <button id="btnMenuPromos" onclick="mostrarSeccion('promociones')">🍔 Inicio (Combos)</button>
                <button id="btnMenuCarta" onclick="mostrarSeccion('carta')">📖 Menú Completo</button>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="admin-main">
            
            <section id="seccionOrdenes" class="seccion activa">
                <div class="header-seccion">
                    <h2>Control de Pedidos</h2>
                    <button onclick="limpiarTodosLosPedidos()" class="btn-rojo">⚠️ Limpiar Todos los Pedidos</button>
                </div>
                <div id="contenedorOrdenes"></div>
            </section>

            <section id="seccionPromociones" class="seccion">
                <div class="header-seccion">
                    <h2>Gestión del Menú (Página de Inicio)</h2>
                </div>
                <button id="btnAgregarNuevoFormulario" style="background:#f39c12; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:20px;">+ Agregar Combo al Inicio</button>
                <div id="contenedorFormulariosProductos"></div>
            </section>

            <section id="seccionCarta" class="seccion">
                <div class="header-seccion">
                    <h2>Gestión de la Carta (Menú Completo)</h2>
                </div>
                <button id="btnAgregarItemCarta" style="background:#f39c12; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:20px;">+ Agregar Plato a la Carta</button>
                <div id="contenedorFormulariosCarta"></div>
            </section>

        </main>
    </div>

    <script type="module">
        import { auth, db } from '../controllers/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        onAuthStateChanged(auth, (usuario) => { if (!usuario) window.location.href = "../index.html"; });
        window.cerrarSesion = () => signOut(auth).then(() => window.location.href = "../index.html");

        window.mostrarSeccion = (seccion) => {
            ['ordenes', 'promociones', 'carta'].forEach(sec => {
                document.getElementById('seccion' + sec.charAt(0).toUpperCase() + sec.slice(1)).classList.toggle('activa', seccion === sec);
            });
            document.getElementById('btnMenuOrdenes').classList.toggle('activo', seccion === 'ordenes');
            document.getElementById('btnMenuPromos').classList.toggle('activo', seccion === 'promociones');
            document.getElementById('btnMenuCarta').classList.toggle('activo', seccion === 'carta');
        };

        setInterval(() => document.getElementById('reloj').innerText = new Date().toLocaleTimeString(), 1000);

        onSnapshot(query(collection(db, "pedidos"), orderBy("timestamp", "desc")), (snapshot) => {
            const contenedor = document.getElementById('contenedorOrdenes');
            if (snapshot.empty) return contenedor.innerHTML = '<p style="color: #a5b1c2;">No hay pedidos en este momento.</p>';
            let html = '';
            snapshot.forEach((docSnap) => {
                const orden = docSnap.data();
                let itemsHTML = (orden.items || []).map(p => `<li><span>${p.cantidad || 1}x ${p.nombre}</span></li>`).join('');
                let hora = orden.timestamp ? orden.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Reciente';
                html += `
                    <div class="orden-card ${orden.completada ? 'completada' : ''}">
                        <div class="cliente-tag">👤 ${orden.cliente || 'Cliente'}</div>
                        <h3 style="margin-top:0; color: #ffffff;">Orden</h3>
                        <div style="color:#a5b1c2;font-size:14px;">🕒 ${hora}</div>
                        <ul class="lista-platos">${itemsHTML}</ul>
                        ${orden.total ? `<div class="total-pedido">Total: $${orden.total.toLocaleString('es-CO')}</div>` : ''}
                        <button class="btn-despachar ${orden.completada ? 'btn-completado' : ''}" onclick="alternarEstadoOrden('${docSnap.id}', ${orden.completada})">
                            ${orden.completada ? '✓ Completado' : 'Despachar ✓'}
                        </button>
                        <button class="btn-eliminar" onclick="eliminarOrden('${docSnap.id}')">Eliminar</button>
                    </div>`;
            });
            contenedor.innerHTML = html;
        });

        window.alternarEstadoOrden = async (id, estado) => await updateDoc(doc(db, "pedidos", id), { completada: !estado });
        window.eliminarOrden = async (id) => { if (confirm("¿Eliminar comanda?")) await deleteDoc(doc(db, "pedidos", id)); };
        window.limpiarTodosLosPedidos = async () => {
            if (confirm("¿Borrar TODOS los pedidos?")) {
                const snaps = await getDocs(collection(db, "pedidos"));
                snaps.docs.forEach(d => deleteDoc(doc(db, "pedidos", d.id)));
            }
        };

        function crearFormularioProducto(data = null, id = null) {
            const div = document.createElement('div');
            div.className = 'formulario-admin';
            const imgSrc = data?.imagen || 'https://via.placeholder.com/150/001224/FFFFFF?text=Imagen';
            
            div.innerHTML = `
                <form class="form-producto-dinamico">
                    <div class="fila-producto">
                        <div class="preview-img"><img class="previewImagen" src="${imgSrc}"></div>
                        <div class="campos-producto">
                            <label>Nombre del Combo</label>
                            <input type="text" class="prodNombre" value="${data?.nombre || ''}" required ${data ? 'disabled' : ''}>
                            <label>Precio (COP)</label>
                            <input type="number" class="prodPrecio" value="${data?.precio || ''}" required ${data ? 'disabled' : ''}>
                            <label>URL de la imagen</label>
                            <input type="url" class="prodUrl" value="${data?.imagen || ''}" required ${data ? 'disabled' : ''}>
                        </div>
                    </div>
                    <div class="acciones-formulario" style="margin-top:15px; display:flex; gap:10px;">
                        <button type="button" class="btn-editar" style="background:#3498db; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold; ${data ? '' : 'display:none;'}">✏️ Editar</button>
                        <button type="submit" class="btn-guardar" style="background:#27ae60; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold; ${data ? 'display:none;' : ''}">Guardar Combo</button>
                        <button type="button" class="btn-rojo btnEliminarProd" style="${data ? '' : 'display:none;'}">🗑️ Eliminar</button>
                    </div>
                </form>`;
            document.getElementById('contenedorFormulariosProductos').prepend(div); 

            const form = div.querySelector('form');
            const btnEditar = div.querySelector('.btn-editar');
            const btnGuardar = div.querySelector('.btn-guardar');
            const btnEliminar = div.querySelector('.btnEliminarProd');
            const inputs = div.querySelectorAll('input');

            div.querySelector('.prodUrl').addEventListener('input', e => div.querySelector('.previewImagen').src = e.target.value || imgSrc);

            btnEditar.addEventListener('click', () => {
                inputs.forEach(i => i.disabled = false);
                btnEditar.style.display = 'none';
                btnGuardar.style.display = 'block';
                btnGuardar.innerText = '💾 Guardar Cambios';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                btnGuardar.disabled = true;
                btnGuardar.innerText = 'Guardando...';

                const newData = {
                    nombre: div.querySelector('.prodNombre').value,
                    precio: parseFloat(div.querySelector('.prodPrecio').value),
                    imagen: div.querySelector('.prodUrl').value
                };

                try {
                    if (id) {
                        await updateDoc(doc(db, "productos", id), newData); 
                    } else {
                        const ref = await addDoc(collection(db, "productos"), newData); 
                        id = ref.id;
                    }
                    inputs.forEach(i => i.disabled = true);
                    btnGuardar.disabled = false;
                    btnGuardar.style.display = 'none';
                    btnEditar.style.display = 'block';
                    btnEliminar.style.display = 'block';
                } catch (error) {
                    alert("Error al guardar");
                    btnGuardar.disabled = false;
                    btnGuardar.innerText = id ? '💾 Guardar Cambios' : 'Guardar Combo';
                }
            });

            btnEliminar.addEventListener('click', async () => {
                if(confirm('¿Seguro que deseas eliminar este combo?')) { 
                    if (id) await deleteDoc(doc(db, "productos", id)); 
                    div.remove(); 
                }
            });
        }
        document.getElementById('btnAgregarNuevoFormulario').addEventListener('click', () => crearFormularioProducto());
        getDocs(collection(db, "productos")).then(snap => snap.forEach(doc => crearFormularioProducto(doc.data(), doc.id)));


        function crearFormularioCarta(data = null, id = null) {
            const div = document.createElement('div');
            div.className = 'formulario-admin';
            
            const opcionesCategoria = ['Hamburguesas', 'Perros & Salchipapas', 'Postres', 'Bebidas', 'Promociones']
                .map(cat => `<option value="${cat}" ${data?.categoria === cat ? 'selected' : ''}>${cat}</option>`).join('');

            div.innerHTML = `
                <form class="form-carta-dinamico">
                    <div class="campos-producto">
                        <label>Categoría</label>
                        <select class="cartaCategoria" style="padding:10px; background:#001224; color:white; border:1px solid #004477; border-radius:4px;" ${data ? 'disabled' : ''}>
                            ${opcionesCategoria}
                        </select>
                        <label>Nombre del Plato/Bebida</label>
                        <input type="text" class="cartaNombre" value="${data?.nombre || ''}" required ${data ? 'disabled' : ''}>
                        <label>Precio (COP)</label>
                        <input type="number" class="cartaPrecio" value="${data?.precio || ''}" required ${data ? 'disabled' : ''}>
                        <label>Descripción / Ingredientes</label>
                        <input type="text" class="cartaDesc" value="${data?.descripcion || ''}" required ${data ? 'disabled' : ''}>
                    </div>
                    <div class="acciones-formulario" style="margin-top:15px; display:flex; gap:10px;">
                        <button type="button" class="btn-editar" style="background:#3498db; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold; ${data ? '' : 'display:none;'}">✏️ Editar</button>
                        <button type="submit" class="btn-guardar" style="background:#27ae60; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold; ${data ? 'display:none;' : ''}">Guardar Plato</button>
                        <button type="button" class="btn-rojo btnEliminarCarta" style="${data ? '' : 'display:none;'}">🗑️ Eliminar</button>
                    </div>
                </form>`;
            document.getElementById('contenedorFormulariosCarta').prepend(div);

            const form = div.querySelector('form');
            const btnEditar = div.querySelector('.btn-editar');
            const btnGuardar = div.querySelector('.btn-guardar');
            const btnEliminar = div.querySelector('.btnEliminarCarta');
            const inputs = div.querySelectorAll('input, select');
            
            btnEditar.addEventListener('click', () => {
                inputs.forEach(i => i.disabled = false);
                btnEditar.style.display = 'none';
                btnGuardar.style.display = 'block';
                btnGuardar.innerText = '💾 Guardar Cambios';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                btnGuardar.disabled = true;
                btnGuardar.innerText = 'Guardando...';

                const newData = {
                    categoria: div.querySelector('.cartaCategoria').value,
                    nombre: div.querySelector('.cartaNombre').value,
                    precio: parseFloat(div.querySelector('.cartaPrecio').value),
                    descripcion: div.querySelector('.cartaDesc').value
                };

                try {
                    if (id) {
                        await updateDoc(doc(db, "menu_completo", id), newData); 
                    } else {
                        const ref = await addDoc(collection(db, "menu_completo"), newData); 
                        id = ref.id;
                    }
                    inputs.forEach(i => i.disabled = true);
                    btnGuardar.disabled = false;
                    btnGuardar.style.display = 'none';
                    btnEditar.style.display = 'block';
                    btnEliminar.style.display = 'block';
                } catch (error) {
                    alert("Error al guardar en la carta");
                    btnGuardar.disabled = false;
                    btnGuardar.innerText = id ? '💾 Guardar Cambios' : 'Guardar Plato';
                }
            });

            btnEliminar.addEventListener('click', async () => {
                if(confirm('¿Seguro que deseas eliminar este plato?')) { 
                    if (id) await deleteDoc(doc(db, "menu_completo", id)); 
                    div.remove(); 
                }
            });
        }
        document.getElementById('btnAgregarItemCarta').addEventListener('click', () => crearFormularioCarta());
        getDocs(collection(db, "menu_completo")).then(snap => snap.forEach(doc => crearFormularioCarta(doc.data(), doc.id)));

    </script>
</body>
</html>
